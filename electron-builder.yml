appId: com.forkfield.app
productName: Forkfield
directories:
  output: dist
# Publish to GitHub Releases. Requires GITHUB_TOKEN env var on CI.
# Token needs repo:public_repo permission for public repos (classic token).
publish:
  - provider: github
    owner: stephengreer97  # must match the GitHub org/user in the repo URL
    repo: forkfield
    releaseType: release  # or 'draft' for testing
files:
  - out/**/*
  - package.json
  - node_modules/**/*
  # The Claude CLI ships as one ~256 MB binary per platform+arch, and the app is
  # useless without the one it runs on (the SDK resolves
  # @anthropic-ai/claude-agent-sdk-<platform>-<arch>/claude and errors out if it
  # is missing). Keep exactly that one: each platform block below drops every
  # sibling. These must be exclusions — electron-builder ignores *include*
  # patterns for node_modules, taking only the "!" ones.
asarUnpack:
  - '**/@anthropic-ai/claude-agent-sdk-*/**'
win:
  # "!(win32-${arch})" is an extglob: it matches every sibling package whose
  # name is not this build's, so only the right binary survives. ${arch} is
  # expanded per pack, which is what makes the two-arch mac build work.
  files:
    - '!node_modules/@anthropic-ai/claude-agent-sdk-!(win32-${arch})/**'
  target:
    - nsis
    - zip
  artifactName: ${productName}-${version}-windows-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
mac:
  files:
    - '!node_modules/@anthropic-ai/claude-agent-sdk-!(darwin-${arch})/**'
  # Both arches explicitly: the CI runner is Apple Silicon, so a default build
  # produces arm64 only and Intel users get no update path. electron-updater
  # picks the right file out of latest-mac.yml by looking for "arm64" in the
  # name, which the artifactName below provides.
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  # Requires Apple Developer account for code signing and notarization.
  # Set via env: APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID (or use --sign-and-notarize CLI flag).
  notarize: false  # Set to true once you have the credentials wired
linux:
  # Drops the musl variant too: it installs alongside the glibc build, and the
  # AppImage and deb both target glibc.
  files:
    - '!node_modules/@anthropic-ai/claude-agent-sdk-!(linux-${arch})/**'
  target:
    - AppImage
    - deb
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
# electron-updater can only replace a running AppImage, never a deb install, so
# keep the deb out of latest-linux.yml. Deb users are pointed at the release
# page instead (see src/main/updater.ts).
deb:
  publish: null
