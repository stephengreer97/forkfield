appId: com.forkfield.app
productName: Forkfield
directories:
  output: dist
# Publish to GitHub Releases. Requires GITHUB_TOKEN env var on CI.
# Token needs repo:public_repo permission for public repos (classic token).
publish:
  - provider: github
    owner: stephengreer97  # must match the GitHub org/user in the repo URL
    repo: forkfield
    releaseType: release  # or 'draft' for testing
files:
  - out/**/*
  - package.json
  - node_modules/**/*
  # Only the target platform's Claude CLI binary is needed; each is ~256 MB.
  - '!node_modules/@anthropic-ai/claude-agent-sdk-linux-x64/**'
  - '!node_modules/@anthropic-ai/claude-agent-sdk-linux-x64-musl/**'
  - '!node_modules/@anthropic-ai/claude-agent-sdk-linux-arm64/**'
  - '!node_modules/@anthropic-ai/claude-agent-sdk-linux-arm64-musl/**'
  - '!node_modules/@anthropic-ai/claude-agent-sdk-darwin-x64/**'
  - '!node_modules/@anthropic-ai/claude-agent-sdk-darwin-arm64/**'
  - '!node_modules/@anthropic-ai/claude-agent-sdk-win32-arm64/**'
asarUnpack:
  - '**/@anthropic-ai/claude-agent-sdk-*/**'
win:
  target:
    - nsis
    - zip
  artifactName: ${productName}-${version}-windows-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
mac:
  target:
    - dmg
    - zip
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  # Requires Apple Developer account for code signing and notarization.
  # Set via env: APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID (or use --sign-and-notarize CLI flag).
  notarize: false  # Set to true once you have the credentials wired
linux:
  target:
    - AppImage
    - deb
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
