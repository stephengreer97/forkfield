name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Build Electron (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish=never

      # latest*.yml is the manifest electron-updater polls; without it in the
      # release, the in-app updater never sees that a new version exists.
      # The .blockmap files let it download only the changed chunks.
      - name: Upload Windows release
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/Forkfield-*.zip
            dist/Forkfield-*.exe
            dist/Forkfield-*.blockmap
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Electron (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish=never
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload macOS release
        if: runner.os == 'macOS'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/Forkfield-*.dmg
            dist/Forkfield-*.zip
            dist/Forkfield-*.blockmap
            dist/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Electron (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --publish=never

      - name: Upload Linux release
        if: runner.os == 'Linux'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/Forkfield-*.AppImage
            dist/Forkfield-*.deb
            dist/latest-linux.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
