name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Build Electron (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish=never

      # latest*.yml is the manifest electron-updater polls; without it in the
      # release, the in-app updater never sees that a new version exists.
      # The .blockmap files let it download only the changed chunks.
      - name: Upload Windows release
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v1
        with:
          body_path: .github/release-notes.md
          files: |
            dist/Forkfield-*.zip
            dist/Forkfield-*.exe
            dist/Forkfield-*.blockmap
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The macOS runner is Apple Silicon, so npm installs only the arm64 Claude
      # binary and the Intel app would ship without one. Fetch it straight from
      # the registry: `npm install` would re-resolve the tree against this
      # host's os/cpu and can drop the arm64 package the other build needs.
      - name: Fetch the Intel Claude binary
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./node_modules/@anthropic-ai/claude-agent-sdk/package.json').version")
          PKG="node_modules/@anthropic-ai/claude-agent-sdk-darwin-x64"
          TARBALL=$(cd /tmp && npm pack "@anthropic-ai/claude-agent-sdk-darwin-x64@$VERSION" --loglevel=error | tail -1)
          mkdir -p "$PKG"
          tar -xzf "/tmp/$TARBALL" -C "$PKG" --strip-components=1
          chmod +x "$PKG/claude"
          file "$PKG/claude" | grep -q x86_64 || { echo "::error::not an x86_64 binary"; exit 1; }

      # With a Developer ID certificate in CSC_LINK the app is signed and
      # notarized, and opens with no warning at all. Without it the build still
      # succeeds, but falls back to an ad-hoc signature: openable only after the
      # user clicks through "unidentified developer". Note the credentials are
      # exported only on the signed path — notarizing an ad-hoc signed app is
      # rejected by Apple and would fail the build.
      - name: Build Electron (macOS)
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "${CSC_LINK:-}" ]; then
            # electron-builder looks for APPLE_APP_SPECIFIC_PASSWORD, not
            # APPLE_PASSWORD; under the wrong name it skips notarization with
            # only a warning.
            export APPLE_ID="$APPLE_ID_SECRET"
            export APPLE_APP_SPECIFIC_PASSWORD="$APPLE_PASSWORD_SECRET"
            export APPLE_TEAM_ID="$APPLE_TEAM_ID_SECRET"
            npx electron-builder --mac --publish=never
          else
            echo "::warning::No CSC_LINK secret — building ad-hoc signed. Users will have to click through the unidentified-developer prompt. Add the Developer ID certificate to enable notarization."
            npx electron-builder --mac --publish=never \
              --config.mac.identity=- \
              --no-config.mac.hardenedRuntime \
              --no-config.mac.notarize
          fi

      - name: Upload macOS release
        if: runner.os == 'macOS'
        uses: softprops/action-gh-release@v1
        with:
          body_path: .github/release-notes.md
          files: |
            dist/Forkfield-*.dmg
            dist/Forkfield-*.zip
            dist/Forkfield-*.blockmap
            dist/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Electron (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --publish=never

      - name: Upload Linux release
        if: runner.os == 'Linux'
        uses: softprops/action-gh-release@v1
        with:
          body_path: .github/release-notes.md
          files: |
            dist/Forkfield-*.AppImage
            dist/Forkfield-*.deb
            dist/latest-linux.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
